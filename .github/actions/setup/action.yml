name: Setup
description: Node from .nvmrc with the npm cache, then a clean install. Every job uses this so versions never drift.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm
    - run: npm ci
      shell: bash
